<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate &amp; Genes Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b4255;--parch:#ece5d8;--gold:#d3bc8e;--gold-d:#7a6232;--glow:#f6e9c6;--n1:#171c2e;--n2:#2a3150;--good:#2b7048;--bad:#a8374a}
*{box-sizing:border-box}
html{background:var(--n1)}
body{margin:0;min-height:100vh;color:#d5daee;font:18px/1.55 "Source Sans 3","Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse at 50% -10%,#4a5683 0%,transparent 55%),linear-gradient(180deg,var(--n2) 0%,var(--n1) 70%) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 62%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 44% 30%,var(--glow) 50%,transparent 51%),radial-gradient(1px 1px at 63% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 48%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 80%,var(--glow) 50%,transparent 51%),radial-gradient(1px 1px at 8% 88%,#fff 50%,transparent 51%)}
main{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 3rem}
header{text-align:center;margin-bottom:1.75rem}
.eyebrow{font:700 .8rem Cinzel,Georgia,serif;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin:0 0 .6rem}
h1{font:700 clamp(2rem,8vw,3.2rem)/1.1 Cinzel,Georgia,serif;margin:0;color:var(--glow);text-shadow:0 0 22px rgba(246,233,198,.45),0 2px 0 rgba(0,0,0,.35)}
.tag{color:#c9cfe3;margin:.8rem auto 0;max-width:30rem}
.tag::after{content:"";display:block;width:.65rem;height:.65rem;margin:1.3rem auto 0;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 12px var(--gold)}
.panel{background:var(--parch);color:var(--ink);border:1px solid var(--gold);border-radius:6px;outline:1px solid var(--gold);outline-offset:-5px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:1.6rem 1.7rem;margin-bottom:1.5rem}
h2{font:700 1.15rem Cinzel,Georgia,serif;letter-spacing:.06em;margin:0 0 .9rem}
label.f{display:block;font-weight:700;margin:1rem 0 .3rem}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:#fbf8f1;border:1px solid var(--gold);border-radius:4px;padding:.6rem .8rem}
input[type=text]:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--gold-d);outline-offset:2px}
.hint{font-size:.95rem;color:#5d6477;margin:.3rem 0 0}
.err{color:var(--bad);font-weight:700;min-height:1.4rem;margin:.6rem 0 0}
.btn,.link{display:inline-block;font:700 .85rem Cinzel,serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;background:var(--parch);color:var(--ink);border:1px solid var(--gold);border-radius:99px;padding:.65rem 1.5rem;box-shadow:0 3px 0 var(--gold-d);cursor:pointer}
.btn:hover:not(:disabled),.link:hover{background:var(--ink);color:var(--glow)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.3rem}
.row .right{margin-left:auto}
.meta{display:flex;justify-content:space-between;font-weight:700;color:var(--gold-d);font-size:.95rem}
.bar{height:12px;background:var(--n1);border:1px solid var(--gold);border-radius:99px;overflow:hidden;margin:.5rem 0 1.2rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b08d4a,var(--glow));transition:width .4s}
.qtext{font-size:1.2rem;font-weight:700;margin:0 0 1rem}
.opts{display:grid;gap:.6rem}
.opt{position:relative;display:flex;gap:.8rem;align-items:flex-start;padding:.8rem .95rem;border:1px solid var(--gold);border-radius:4px;background:rgba(255,255,255,.55);cursor:pointer;font-weight:600;transition:background .15s,color .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dia{flex:none;width:.7rem;height:.7rem;margin-top:.5rem;border:2px solid var(--gold-d);transform:rotate(45deg)}
.opt:hover{background:#fff}
.opt.sel{background:var(--ink);color:#fff}
.opt.sel .dia{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.opt:has(input:focus-visible){outline:3px solid var(--gold-d);outline-offset:2px}
.score{text-align:center}
.big{font:700 clamp(3rem,14vw,4.5rem)/1 Cinzel,serif;color:var(--ink);margin:.2rem 0}
.msg{font-weight:700;font-size:1.15rem;margin:.3rem 0 0}
.status{margin:1rem 0 0;font-weight:600}
.rev{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.rev li{border:1px solid var(--gold);border-radius:4px;padding:.7rem .9rem;background:rgba(255,255,255,.55)}
.rev li.ok{border-left:5px solid var(--good)}
.rev li.no{border-left:5px solid var(--bad);background:#f3dfe2}
.rev b{display:block}
.rev .c{color:var(--good);font-weight:700}
.rev .w{color:var(--bad);font-weight:700}
.hide{display:none}
footer{text-align:center;margin-top:1rem}
footer a{color:var(--gold);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <p class="eyebrow">Science Quiz</p>
  <h1>Climate &amp; Genes Quiz</h1>
  <p class="tag">Grade 10 · 10 questions · Your score goes straight to your teacher.</p>
</header>

<section id="start" class="panel">
  <h2>Before you begin</h2>
  <form id="form" novalidate>
    <label class="f" for="name">Full name</label>
    <input type="text" id="name" maxlength="60" autocomplete="name" placeholder="Last name, First name">
    <label class="f" for="section">Section</label>
    <input type="text" id="section" maxlength="30" placeholder="Example: Sampaguita">
    <p class="hint">Choose one answer for each question. You can go back and change an answer before you finish.</p>
    <p class="err" id="err" role="alert"></p>
    <div class="row"><button class="btn" type="submit">Start quiz</button></div>
  </form>
</section>

<section id="quiz" class="panel hide">
  <div class="meta"><span id="count"></span><span id="topic"></span></div>
  <div class="bar" role="progressbar" aria-label="Quiz progress"><i id="fill"></i></div>
  <p class="qtext" id="qtext"></p>
  <div class="opts" id="opts" role="radiogroup" aria-labelledby="qtext"></div>
  <div class="row">
    <button class="btn" id="back" type="button">Back</button>
    <button class="btn right" id="next" type="button" disabled>Next</button>
  </div>
</section>

<section id="result" class="hide">
  <div class="panel score">
    <h2>Quiz complete</h2>
    <p class="big" id="big"></p>
    <p class="msg" id="msg"></p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="row" style="justify-content:center">
      <button class="btn hide" id="retry" type="button">Retry sending</button>
      <a class="link" href="Science10_Genes_Climate_Reviewer.html">Open the reviewer</a>
      <button class="btn" id="again" type="button">Retake quiz</button>
    </div>
  </div>
  <div class="panel">
    <h2>Review your answers</h2>
    <ul class="rev" id="rev"></ul>
  </div>
</section>

<footer><a href="index.html">← Back to all reviewers</a></footer>
</main>

<script>
/* TEACHER: paste your Google Apps Script Web app URL (ends in /exec) between the quotes below. */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbz9ly53iyacm-UteS1BYA8IaOxc9gGNh89OpygoNiPCOlhHFQvGFYtx3wCql0BYnE952g/exec";

const QUIZ_NAME = "Grade 10 - Climate & Genes";
/* Each question: [topic, question, CORRECT answer, wrong 1, wrong 2, wrong 3] — answers are shuffled for every student. */
const DATA = [
 [
  "Modern biotech",
  "Which of these is an example of modern biotechnology?",
  "Inserting a bacterium’s gene into corn so it resists pests",
  "Fermenting milk into yogurt",
  "Breeding the best cows over many generations",
  "Saving seeds from the biggest plants"
 ],
 [
  "GMOs",
  "What is a genetically modified organism (GMO)?",
  "An organism whose genes were changed in a laboratory",
  "An organism bred over many generations",
  "An organism grown from a small piece of tissue",
  "An organism raised without fertilizer"
 ],
 [
  "Ethics",
  "A classmate says, “All GM crops are harmful, so ban them.” What is the best evaluation?",
  "Too extreme: safety should be tested case by case",
  "Correct: every GM crop is dangerous",
  "Correct: banning is the only safe choice",
  "Too weak: GM crops need no testing at all"
 ],
 [
  "Warming evidence",
  "Which is the most direct evidence of global warming?",
  "A rise in Earth’s average temperature",
  "Growing polar ice sheets",
  "Falling sea levels",
  "Thicker glaciers"
 ],
 [
  "Data table",
  "A table shows temperature rising each year while glacier area shrinks. What is the conclusion?",
  "As temperature rises, ice decreases",
  "As temperature rises, ice increases",
  "Temperature and ice are not related",
  "Glaciers grow when it gets warmer"
 ],
 [
  "Greenhouse gases",
  "Which of these is NOT a main greenhouse gas?",
  "Nitrogen",
  "Carbon dioxide",
  "Methane",
  "Nitrous oxide"
 ],
 [
  "CO₂",
  "Burning coal, gasoline, and oil increases the amount of which gas in the air?",
  "Carbon dioxide",
  "Nitrogen",
  "Argon",
  "Oxygen"
 ],
 [
  "Methane",
  "Which activity is a main source of methane (CH₄)?",
  "Livestock and decomposing waste in landfills",
  "Using nitrogen fertilizer",
  "Trees taking in carbon dioxide",
  "Burning gasoline in cars"
 ],
 [
  "El Niño",
  "What does El Niño usually bring to the Philippines?",
  "Below-normal rainfall, drought, and dry spells",
  "Above-normal rainfall and floods",
  "Cooler surface waters in the Pacific",
  "Heavy landslides in every province"
 ],
 [
  "ENSO prep",
  "A community wants to prepare for La Niña. Which action fits best?",
  "Clear drainage canals and secure harvests early",
  "Store water and plant drought-tolerant crops",
  "Wait until the rivers rise before acting",
  "Ignore PAGASA advisories"
 ]
];
const QUESTIONS = DATA.map(d => ({ t: d[0], q: d[1], o: d.slice(2) }));
const N = QUESTIONS.length;
const $ = id => document.getElementById(id);
let cur = 0, picks = [], order = [], student = {}, payload = null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function screen(id){ ["start","quiz","result"].forEach(s => $(s).classList.toggle("hide", s !== id)); window.scrollTo(0,0); }

function begin(){
  picks = new Array(N).fill(null);
  order = QUESTIONS.map(() => shuffle([0,1,2,3]));
  show(0);
  screen("quiz");
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("name").value.trim(), section = $("section").value.trim();
  if(!name || !section){ $("err").textContent = "Please type both your name and your section."; return; }
  $("err").textContent = "";
  student = { name, section };
  begin();
});

function show(i){
  cur = i;
  const q = QUESTIONS[i];
  $("count").textContent = "Question " + (i+1) + " of " + N;
  $("topic").textContent = q.t;
  $("fill").style.width = (i / N * 100) + "%";
  $("qtext").textContent = q.q;
  const box = $("opts"); box.innerHTML = "";
  order[i].forEach(oi => {
    const l = document.createElement("label");
    l.className = "opt" + (picks[i] === oi ? " sel" : "");
    l.innerHTML = '<input type="radio" name="opt"><span class="dia"></span><span class="tx"></span>';
    const inp = l.querySelector("input");
    inp.checked = picks[i] === oi;
    l.querySelector(".tx").textContent = q.o[oi];
    inp.addEventListener("change", () => {
      picks[i] = oi;
      box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x.querySelector("input").checked));
      $("next").disabled = false;
    });
    box.appendChild(l);
  });
  $("back").disabled = i === 0;
  $("next").disabled = picks[i] === null;
  $("next").textContent = i === N - 1 ? "Finish" : "Next";
}
$("back").addEventListener("click", () => { if(cur > 0) show(cur - 1); });
$("next").addEventListener("click", () => { if(cur < N - 1) show(cur + 1); else finish(); });
$("again").addEventListener("click", () => { $("name").value = student.name || ""; $("section").value = student.section || ""; screen("start"); });
$("retry").addEventListener("click", send);

function finish(){
  const missed = [];
  let score = 0;
  const rev = $("rev"); rev.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const right = picks[i] === 0;
    if(right) score++; else missed.push("Q" + (i+1) + " " + q.t);
    const li = document.createElement("li");
    li.className = right ? "ok" : "no";
    const b = document.createElement("b"); b.textContent = (i+1) + ". " + q.q;
    const a = document.createElement("span");
    a.className = right ? "c" : "w";
    a.textContent = (right ? "✓ Correct: " : "✗ Your answer: ") + q.o[picks[i]];
    li.append(b, a);
    if(!right){
      const c = document.createElement("span");
      c.className = "c"; c.style.display = "block";
      c.textContent = "Correct answer: " + q.o[0];
      li.append(c);
    }
    rev.appendChild(li);
  });
  const pct = score / N * 100;
  $("big").textContent = score + " / " + N;
  $("msg").textContent = pct >= 90 ? "Outstanding work!" : pct >= 70 ? "Great job!" : pct >= 50 ? "Good effort. Review the reviewer and try again." : "Keep going! Open the reviewer and try again.";
  payload = { name: student.name, section: student.section, quiz: QUIZ_NAME, score, total: N, answers: missed.length ? "Missed: " + missed.join("; ") : "Perfect score" };
  $("fill").style.width = "100%";
  screen("result");
  send();
}

async function send(){
  const st = $("status"), retry = $("retry");
  retry.classList.add("hide");
  if(SHEET_URL.indexOf("PASTE_") === 0){ st.textContent = "Your results are not connected to the teacher’s sheet yet. Please tell your teacher."; return; }
  st.textContent = "Sending your results…";
  try{
    await fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    st.textContent = "✓ Your results were sent to your teacher.";
  }catch(err){
    st.textContent = "Your results could not be sent. Check your internet, then press Retry sending.";
    retry.classList.remove("hide");
  }
}
</script>
</body>
</html>
